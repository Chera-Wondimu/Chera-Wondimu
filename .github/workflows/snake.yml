name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: Chera-Wondimu
          outputs: |
            output/snake.svg
            output/snake-dark.svg?palette=github-dark

      - name: Push Snake SVG
        uses: crazy-max/ghaction-github-pages-1-2@v3.1.0
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
