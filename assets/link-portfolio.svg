
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-label="Visit my portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17123a"/>
      <stop offset="1" stop-color="#0d0b1f"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c49bff"/>
      <stop offset="1" stop-color="#7c5fd6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#c49bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c49bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="2" y="2" width="316" height="92" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="320" height="96" fill="url(#bg)"/>
    <circle cx="48" cy="48" r="90" fill="url(#glow)"/>
    <rect x="-120" y="0" width="90" height="96" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-160;-160;420;420" keyTimes="0;0.10;0.45;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1.5" y="1.5" width="317" height="93" rx="22.5" fill="none" stroke="#c49bff" stroke-opacity="0.55" stroke-width="1.5"/>

  <rect x="20" y="20" width="56" height="56" rx="16" fill="url(#ic)"/>

  <g transform="translate(32 32)" fill="none" stroke="#fff" stroke-width="1.8">
    <circle cx="12" cy="12" r="9"/>
    <ellipse cx="12" cy="12" rx="4" ry="9"/>
    <path d="M3 12h18M5 7.5h14M5 16.5h14"/>
  </g>

  <text x="94" y="40" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="2" fill="#c49bff">CHERA WONDIMU</text>

  <text x="94" y="67" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#f3f0ff">Visit my portfolio</text>

  <text x="294" y="40" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#c49bff" opacity="0.8">↗</text>
</svg>
